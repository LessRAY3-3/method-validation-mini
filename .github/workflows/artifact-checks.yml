name: Published artifact checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify published results without simulation dependencies
        run: python scripts/release_smoke.py
